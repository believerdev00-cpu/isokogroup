project_id = "oswetaksxcepublsjyrt"

[functions.training]
# Built from training-api/ with `npm --prefix training-api run build`.
# The API checks the Isoko access token itself; public pages (programs, applying,
# status lookup, certificate checks) are used without signing in.
verify_jwt = false
entrypoint = "./functions/training/index.js"

[functions.payments-webhook]
# Payment providers can't send an Isoko access token; each webhook is checked
# by the provider's signature instead (see functions/payments-webhook).
verify_jwt = false

[functions.payments-itecpay]
# ItecPay's callbacks carry no Supabase token. The customer's screen calls
# send/check with the payment id it received; the sweep checks the
# service-role key itself (see functions/payments-itecpay).
verify_jwt = false

[functions.notifications-status]
# Providers report delivery without a Supabase token; each report is checked
# by the provider's signature instead (see functions/notifications-status).
verify_jwt = false

[functions.research-ask]
# The Information Hub's question box is public: visitors ask without an
# account. The function rate-limits by a hash of the caller (30 an hour),
# validates the question itself and talks to the database with the
# service-role key (see functions/research-ask).
verify_jwt = false

[functions.research-sitemap]
# Search engines fetch the research sitemap without any token.
verify_jwt = false
